language: en-US
early_access: false
reviews:
  profile: assertive
  request_changes: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/android/**"
    - "!**/src-tauri/target/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
chat:
  auto_reply: true