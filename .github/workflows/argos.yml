name: Argos

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  argos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nafaka
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nafaka/package-lock.json
      # PR #5 adds native Capacitor dependencies. Keep CI installable even
      # when the lockfile has not yet been regenerated by a local npm run.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
