name: Nafaka quality

on:
  pull_request:
    paths:
      - 'nafaka/**'
  push:
    branches:
      - main
      - play-store-compliance

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nafaka
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nafaka/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
