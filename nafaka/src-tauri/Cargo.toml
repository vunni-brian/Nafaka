[package]
name = "nafaka"
version = "0.1.0"
description = "Nafaka — an AI financial operating system"
authors = ["Nafaka"]
edition = "2021"

[lib]
name = "nafaka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"